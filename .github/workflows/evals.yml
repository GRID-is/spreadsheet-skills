name: Skill evals

# Runs the agent evals in evals/ with `claude plugin eval`: a fresh Claude Code
# session per case, scored on whether the right skill fired and the result is
# correct. Calls the model, so it runs weekly, on demand, and from the sync
# workflow after a package bump, not on every push. Needs the ANTHROPIC_API_KEY
# repository secret.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to evaluate
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bash inside an eval run is confined by Claude Code's OS sandbox, which
      # needs these two on Linux.
      - name: Install sandbox backend
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run test:evals -- --model claude-sonnet-5 --judge-model claude-haiku-4-5 --max-cost-usd 20

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
