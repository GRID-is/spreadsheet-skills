name: Sync API reference

# Keeps the generated reference files in the skills in step with the published
# @grid-is packages. Runs weekly, on demand, and when a package release fires a
# repository_dispatch with event type "package-released". Opens a pull request
# when anything changed so a person reviews whether the prose needs updating.
#
# A release that renames or drops a documented symbol makes `npm run sync` exit
# non-zero, which is exactly the case a person most needs to see. So the sync
# and lint steps record their outcome instead of ending the job, the pull
# request is opened either way with the failure quoted in its body, and the job
# fails at the end once that pull request exists.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pr-operation: ${{ steps.pr.outputs.pull-request-operation }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Update GRID packages to latest
        run: npm run update-packages

      - name: Regenerate reference files
        id: regen
        continue-on-error: true
        run: |
          set -o pipefail
          npm run sync 2>&1 | tee sync.log

      - name: Lint skills against the new packages
        id: skills-lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Summarise the run
        id: summary
        run: |
          {
            echo "list<<EOF"
            for p in spreadsheet-engine spreadsheet-viewer spreadsheet-editor agent-tools; do
              echo "- @grid-is/$p@$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@grid-is/$p/package.json', 'utf8')).version")"
            done
            echo "EOF"
            echo "status<<EOF"
            if [ "${{ steps.regen.outcome }}" = "success" ] && [ "${{ steps.skills-lint.outcome }}" = "success" ]; then
              echo "The reference regenerated cleanly and the lint passed against the new packages."
            else
              echo "**This run did not complete cleanly.** The package bump is included, but the"
              echo "reference may be stale. A symbol listed in \`scripts/api-reference.config.mjs\`"
              echo "was probably renamed or removed upstream."
              echo ""
              for f in sync lint; do
                if [ -s "$f.log" ]; then
                  echo "<details><summary>npm run $f</summary>"
                  echo ""
                  echo '```'
                  tail -40 "$f.log"
                  echo '```'
                  echo ""
                  echo "</details>"
                  echo ""
                fi
              done
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm -f sync.log lint.log

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/api-reference
          title: "Sync API reference with latest GRID packages"
          commit-message: "Sync API reference with latest GRID packages"
          body: |
            Regenerated by the sync workflow after updating to:

            ${{ steps.summary.outputs.list }}

            Review the diff for methods that were added, removed or changed and update the
            hand-written SKILL.md prose where it refers to them.

            ${{ steps.summary.outputs.status }}
          labels: sync
          delete-branch: true

      - name: Fail if the sync or lint failed
        if: steps.regen.outcome != 'success' || steps.skills-lint.outcome != 'success'
        run: |
          echo "The pull request was opened so the failure is reviewable, but this run failed."
          exit 1

  # A pull request opened with the workflow's own token does not trigger the
  # `pull_request` event, so CI never runs on it by itself. Start it here.
  checks:
    needs: sync
    if: contains(fromJSON('["created", "updated"]'), needs.sync.outputs.pr-operation)
    uses: ./.github/workflows/ci.yml
    with:
      ref: sync/api-reference
